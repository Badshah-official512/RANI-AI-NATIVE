org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# PUBLIC client configuration — PLACEHOLDERS ONLY in this public repo.
# Real values are injected at CI build time from GitHub Secrets
# (see docs/SETUP-SECRETS.md) and NEVER committed.
# The Supabase publishable key is a public client key by design; RLS protects data.
# The service_role key and Firebase service accounts must NEVER appear here.
SUPABASE_URL=https://PLACEHOLDER.supabase.co
SUPABASE_PUBLISHABLE_KEY=PLACEHOLDER_PUBLISHABLE_KEY
# Region of the deployed Firebase callable functions
FIREBASE_FUNCTIONS_REGION=us-central1
